[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-arabic-translator"
version = "0.1.0"
description = "MangaAR: free, offline-capable Manga/Manhwa/Manhua/comic page translator to Arabic (CLI + local GUI)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "MangaAR contributors" }]
keywords = ["manga", "comic", "translation", "arabic", "ocr", "inpainting", "typesetting"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Natural Language :: Arabic",
  "Topic :: Multimedia :: Graphics",
]
# Core install: runs the full pipeline (classical detector, OpenCV inpainting, online
# providers, translation memory, Arabic typesetting). Heavy ML engines live in extras.
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<6",
  "pillow>=10.1,<13",
  "fonttools>=4.47,<5",
  "pyyaml>=6.0,<7",
  "platformdirs>=4.0,<5",
  "huggingface_hub>=0.23,<2",
  "requests>=2.31,<3",
  "arabic-reshaper>=3.0,<4",
  "python-bidi>=0.4.2,<0.7",
  "deep-translator>=1.11,<2",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
# PP-OCR models via ONNX Runtime; the wheel bundles the Chinese det/rec/cls models.
rapid = ["rapidocr_onnxruntime>=1.3,<2", "onnxruntime>=1.17,<2"]
# EasyOCR (ja/ko/zh/ar) and LaMa inpainting (TorchScript big-lama); both need torch.
ocr = ["easyocr>=1.7,<2", "torch>=2.1", "torchvision>=0.16"]
lama = ["torch>=2.1"]
# Japanese manga OCR (weights from the Hugging Face Hub on first use).
manga = ["manga-ocr>=0.1.11", "torch>=2.1"]
# PaddleOCR (optional; heavy, pulls its own OpenCV — see docs/DEPENDENCIES.md).
paddle = ["paddleocr>=2.7", "paddlepaddle>=2.6"]
# Offline machine translation (Marian / M2M100 via transformers).
offline-mt = ["transformers>=4.40", "sentencepiece>=0.2", "sacremoses>=0.1", "torch>=2.1"]
# Comic-text-detector ONNX (GPL-3.0 weights; opt-in) runs on onnxruntime.
ctd = ["onnxruntime>=1.17,<2"]
gpu = ["onnxruntime-gpu>=1.17,<2"]
gui = ["gradio>=6,<7", "gradio_client>=2,<3"]
all = [
  "manga-arabic-translator[rapid,ocr,lama,offline-mt,gui]",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pip-licenses>=4.4",
  "types-PyYAML",
  "types-requests",
]

[project.scripts]
manga-arabic = "manga_ar.cli:main"

[project.urls]
Documentation = "https://github.com/ilvb/ilvb/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
manga_ar = ["py.typed", "data/*.json", "data/*.yaml", "assets/fonts/*.ttf", "assets/fonts/SHA256SUMS", "assets/fonts/licenses/*.txt"]

# uv: several OCR packages depend on the GUI build of OpenCV (opencv-python /
# opencv-contrib-python). Both ship the same `cv2` module as the headless build, and
# installing two distributions corrupts cv2. Drop them so exactly one OpenCV exists.
[tool.uv]
override-dependencies = [
  "opencv-python; sys_platform == 'never'",
  "opencv-contrib-python; sys_platform == 'never'",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "BLE", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Arabic/CJK characters in strings/comments are intended

[tool.ruff.lint.per-file-ignores]
"spikes/*" = ["T20", "E501", "E741", "RUF059", "B023", "RUF005", "BLE001"]  # throwaway feasibility scripts
"scripts/*" = ["T20"]
"tests/*" = ["T20", "N802", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["manga_ar", "tools", "benchmarks"]

[[tool.mypy.overrides]]
# OpenCV 5 ships stubs whose Mat|ndarray unions make every call site noisy; treat cv2 as
# untyped and keep our own function signatures strict.
module = ["cv2", "cv2.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["manga_ar.ui.*", "manga_ar.ocr.manga_ocr_engine", "manga_ar.ocr.paddle_engine", "manga_ar.ocr.easyocr_engine", "manga_ar.ocr.rapid_engine", "manga_ar.inpaint.lama", "manga_ar.translate.local_mt", "manga_ar.detect.comic_text_detector"]
# Thin adapters over untyped third-party ML libraries.
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not network and not slow'"
markers = [
  "unit: fast tests, no network, no model downloads (default)",
  "integration: uses real local models (may download on first run)",
  "network: talks to live endpoints",
  "slow: end-to-end / soak tests",
]
filterwarnings = [
  "ignore::DeprecationWarning:google.*",
]

[tool.coverage.run]
source = ["manga_ar"]
branch = true
omit = [
  "src/manga_ar/ui/gradio_app.py",
  "src/manga_ar/ocr/manga_ocr_engine.py",
  "src/manga_ar/ocr/paddle_engine.py",
  "src/manga_ar/ocr/easyocr_engine.py",
  "src/manga_ar/ocr/rapid_engine.py",
  "src/manga_ar/inpaint/lama.py",
  "src/manga_ar/translate/local_mt.py",
  "src/manga_ar/detect/comic_text_detector.py",
]

[tool.coverage.report]
show_missing = false
skip_covered = true
